[package]
name = "rasgovorilka"
version = "0.1.0"
description = "AAC communicator"
authors = ["Vitaliy"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2.0"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
